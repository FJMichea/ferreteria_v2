<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso ERP Ferretería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #2980b9, #8e44ad);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .brand-logo {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">🛠️</div>
        <h3 class="text-center mb-4">Ferretería Quilpuecito</h3>
        <p class="text-center text-muted mb-4">Ingreso al Sistema</p>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" required placeholder="Ej: admin">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </div>
            <div id="error-msg" class="alert alert-danger mt-3 d-none text-center">
                Usuario o clave incorrectos
            </div>
        </form>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/token/';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // ¡ÉXITO! Guardamos la "llave" (Token) en el navegador
                    localStorage.setItem('accessToken', data.access);
                    localStorage.setItem('refreshToken', data.refresh);
                    localStorage.setItem('username', username); // Guardamos el nombre para saludar

                    // Redirigir al Dashboard principal
                    window.location.href = 'index.html';
                } else {
                    // Error: Mostrar mensaje rojo
                    errorMsg.classList.remove('d-none');
                }

            } catch (error) {
                console.error('Error:', error);
                errorMsg.innerText = "Error de conexión con el servidor";
                errorMsg.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
