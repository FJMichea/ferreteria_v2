services:
  # Servicio de Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=ferreteria_db
      - POSTGRES_USER=franciscomichea
      - POSTGRES_PASSWORD=password_secreto

  # Servicio de Aplicación Web (Django)
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    #volumes:
    #  - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - POSTGRES_DB=ferreteria_db
      - POSTGRES_USER=franciscomichea
      - POSTGRES_PASSWORD=password_secreto
    depends_on:
      - db

volumes:
  postgres_data:
